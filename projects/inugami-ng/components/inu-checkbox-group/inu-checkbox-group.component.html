<div [class]="styleClass()">

  <div  class="inu-checkbox-group-label-grp">
    <div class="inu-checkbox-group-label">
      @if (label() || labelKey()) {
        @if(labelKey()){
          <label ><inu-label [key]="labelKey()" [defaultValue]="label()!"></inu-label></label>
        }
        @else{
          <label >{{ label()! }}</label>
        }
      }
    </div>
    @if (_required()) {
      <div class="inu-checkbox-group-required">
        <inu-icon icon="required" [size]="0.5"></inu-icon>
      </div>
    }
  </div>
  <ul>
    @if (_values()) {
      @for (selectItem of _values(); track selectItem.value; let i = $index) {
        <li role="checkbox"
            tabindex="0"
            #checkboxItems
            [class]="getItemClass(selectItem)"
            (keydown)="onKeyDown($event, selectItem)">
          <div (click)="toggle(selectItem)" class="inu-checkbox-group-item">
            <div class="inu-checkbox-group-icon">
              @if (selectItem.selected) {
                <inu-icon icon="check" [size]="0.9" ></inu-icon>
              }
            </div>
            <div class="inu-checkbox-group-label">
              <span>{{ selectItem.title! }}</span>
            </div>
          </div>

          @if(selectItem.tooltips){
            <inu-tool-tips [message]="selectItem.tooltips"></inu-tool-tips>
          }
        </li>
      }
    }
  </ul>
</div>
