<div [class]="_styleClass()">
  <div class="inu-input-text-label">
    @if(icon()){
      <inu-icon [icon]="icon()!" [size]="1"></inu-icon>
    }
    @if (label() || labelKey()) {
      @if(labelKey()){
        <label [for]="id()"><inu-label [key]="labelKey()" [defaultValue]="label()!"></inu-label></label>
      }
      @else{
        <label [for]="id()">{{ label()! }}</label>
      }
    }
    @if (_required()) {
      <inu-icon icon="required" [size]="0.5"></inu-icon>
    }
  </div>

  <input [id]="id()"
         [name]="name()!"
         type="password"
         [value]="value()"
         [disabled]="disabled()"
         (focusin)="onFocus()"
         (focusout)="onFocusOut()"
         (blur)="_formField?.state()?.markAsTouched()"
         (keyup)="onChanged($event)" #input
         [attr.aria-invalid]="!valid()">
</div>
